# kamacu-managed — DO NOT EDIT BY HAND.
#
# Kamacu codex status profile, regenerated at every Kamacu start by
# internal/codex.InstallHookConfig into <CODEX_HOME>/kamacu.config.toml and
# selected ONLY for Kamacu-spawned sessions via `codex -p kamacu` (the profile
# layers on top of the user's own config.toml; it never replaces it). Edits
# here are overwritten on the next boot.
#
# Purpose: forward codex lifecycle events to Kamacu's UNCHANGED claude-
# compatible hook receiver (internal/api/hooks.go, POST
# /api/hooks/sessions/{id}) so a codex-engine task reports
# working/waiting/idle exactly like a claude-engine task. codex sends the
# same wire contract claude does: one JSON object on stdin whose
# hook_event_name discriminates the event.
#
# Env gate (D014): every command no-ops unless Kamacu spawned the codex
# process — Kamacu's manager.Spawn injects KAMACU_SESSION_ID / KAMACU_HOOK_TOKEN /
# KAMACU_HOOK_BASE only for engine=="codex". A plain `codex` run (or any other
# -p kamacu invocation outside Kamacu) runs nothing and touches no network.
#
# Event mapping (verified against codex 0.157.0):
#   SessionStart      -> MarkHooksAlive (BEL fallback off; session_id capture)
#   Stop              -> SetIdle (turn end)
#   PermissionRequest -> SetWaiting (approval prompt)
#
# Stop is SYNCHRONOUS on purpose: codex cancels unfinished background hooks
# when the session ends, so an async Stop would never reach the receiver on
# the final turn. SessionStart/PermissionRequest are async (verified to fire)
# so status reporting never delays a turn or an approval prompt.
#
# Hooks are subject to codex's trust review: run /hooks once inside a
# Kamacu codex session and trust the kamacu entries. Until trusted, hooks are
# skipped and Kamacu falls back to its activity/BEL heuristics.

[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
command = "[ -n \"$KAMACU_SESSION_ID\" ] && curl -s -m 3 -H \"X-Kamacu-Token: $KAMACU_HOOK_TOKEN\" --data-binary @- \"$KAMACU_HOOK_BASE/api/hooks/sessions/$KAMACU_SESSION_ID\""
async = true
timeout = 5

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = "[ -n \"$KAMACU_SESSION_ID\" ] && curl -s -m 3 -H \"X-Kamacu-Token: $KAMACU_HOOK_TOKEN\" --data-binary @- \"$KAMACU_HOOK_BASE/api/hooks/sessions/$KAMACU_SESSION_ID\""
timeout = 5

[[hooks.PermissionRequest]]
[[hooks.PermissionRequest.hooks]]
type = "command"
command = "[ -n \"$KAMACU_SESSION_ID\" ] && curl -s -m 3 -H \"X-Kamacu-Token: $KAMACU_HOOK_TOKEN\" --data-binary @- \"$KAMACU_HOOK_BASE/api/hooks/sessions/$KAMACU_SESSION_ID\""
async = true
timeout = 5
